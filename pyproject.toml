[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "alignmentdelta"
version = "0.1.0"
description = "Research infrastructure for controlled safety-alignment intervention studies"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Rohan Jonnalagadda" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
ml = [
    "accelerate>=1.7,<2",
    "datasets>=3.6,<4",
    "huggingface-hub>=0.30,<1",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "psutil>=7,<8",
    "safetensors>=0.5,<1",
    "scikit-learn>=1.6,<2",
    "scipy>=1.15,<2",
    "torch==2.7.1",
    "transformers>=4.52,<5",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/alignmentdelta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["alignmentdelta"]

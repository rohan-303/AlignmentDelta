[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "alignmentdelta"
version = "0.1.0"
description = "Research infrastructure for controlled safety-alignment intervention studies"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Rohan Jonnalagadda" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alignmentdelta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["alignmentdelta"]
